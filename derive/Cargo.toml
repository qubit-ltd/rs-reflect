[package]
name = "qubit-reflect-derive"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-reflect"
description = "Procedural macros for qubit-reflect"
homepage = "https://github.com/qubit-ltd/rs-reflect"
readme = "README.md"
keywords = ["reflection", "metadata", "derive", "macro", "qubit"]
categories = ["development-tools"]

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3.5.0"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
syn = { version = "3.0.6", features = ["full", "extra-traits", "visit-mut"] }
