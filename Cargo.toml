[package]
name = "qubit-reflect"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-reflect"
description = "Macro-based structural and executable reflection for Rust"
homepage = "https://github.com/qubit-ltd/rs-reflect"
documentation = "https://docs.rs/qubit-reflect"
readme = "README.md"
keywords = ["reflection", "metadata", "derive", "macro", "qubit"]
categories = ["development-tools"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/doc/**",
    "/tests/**",
    "/benches/**",
]

[workspace]
members = [
    ".",
    "derive",
    "test-crates/registry-types",
    "test-crates/registry-impl-a",
    "test-crates/registry-impl-b",
    "test-crates/registry-app",
    "test-crates/model-facade-runtime",
    "test-crates/model-facade-derive",
    "test-crates/model-facade-app",
]
exclude = ["fuzz"]
resolver = "3"

[features]
default = ["derive"]
derive = ["dep:qubit-reflect-derive"]

[dependencies]
inventory = "0.3"
thiserror = "2"
qubit-reflect-derive = { version = "=0.1.0", path = "derive", optional = true }

[dev-dependencies]
trybuild = "1"

[[test]]
name = "integration_tests"
path = "tests/mod.rs"

[[test]]
name = "ui_tests"
path = "tests/ui_tests.rs"

[[bench]]
name = "descriptor_lookup"
harness = false

[[bench]]
name = "registry_init"
harness = false
