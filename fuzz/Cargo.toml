[package]
name = "qubit-reflect-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
qubit-reflect = { path = ".." }

[[bin]]
name = "id_parser"
path = "fuzz_targets/id_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "type_expression"
path = "fuzz_targets/type_expression.rs"
test = false
doc = false
bench = false

[[bin]]
name = "registry_model"
path = "fuzz_targets/registry_model.rs"
test = false
doc = false
bench = false
