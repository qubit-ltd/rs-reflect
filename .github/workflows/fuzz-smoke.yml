name: Fuzz smoke

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: nightly-2026-06-05
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Run bounded fuzz smoke
        env:
          RS_CI_FUZZ_MODE: smoke
          RS_CI_FUZZ_SECONDS_PER_TARGET: '30'
        run: ./scripts/cargo-fuzz-check.sh
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
