name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prepare local path dependencies
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
      - name: Check dependency baseline
        run: ./.infra/bin/dependency-update.sh --check

  downstream-baseline:
    name: Downstream baseline
    runs-on: ubuntu-latest
    steps:
      - name: Require private dependency access
        env:
          DEPENDENCY_TOKEN: ${{ secrets.DEPENDENCY_TOKEN }}
        run: test -n "$DEPENDENCY_TOKEN" || { echo 'DEPENDENCY_TOKEN is required for downstream validation.' >&2; exit 1; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: rust-platform/rs-reflect
          persist-credentials: false
      - name: Validate baseline manifest and expose fixed revisions
        id: revisions
        working-directory: rust-platform/rs-reflect
        run: |
          python3 scripts/downstream_manifest.py validate --manifest .github/downstream-baseline.json
          python3 scripts/downstream_manifest.py matrix --manifest .github/downstream-baseline.json --mode baseline > "$RUNNER_TEMP/downstream-matrix.json"
          for key in rs_model_metadata rs_platform rs_id rs_datatype rs_redact rs_validator rs_validation_rules; do
            printf '%s=%s\n' "$key" "$(jq -r ".repositories.$key.revision" "$RUNNER_TEMP/downstream-matrix.json")" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {repository: qubit-ltd/rs-model-metadata, ref: '${{ steps.revisions.outputs.rs_model_metadata }}', token: '${{ secrets.DEPENDENCY_TOKEN }}', path: rust-platform/rs-model-metadata, persist-credentials: false}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {repository: qubit-ltd/rs-platform, ref: '${{ steps.revisions.outputs.rs_platform }}', token: '${{ secrets.DEPENDENCY_TOKEN }}', path: rust-platform/rs-platform, persist-credentials: false}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {repository: qubit-ltd/rs-id, ref: '${{ steps.revisions.outputs.rs_id }}', token: '${{ secrets.DEPENDENCY_TOKEN }}', path: rust-common/rs-id, persist-credentials: false}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {repository: qubit-ltd/rs-datatype, ref: '${{ steps.revisions.outputs.rs_datatype }}', token: '${{ secrets.DEPENDENCY_TOKEN }}', path: rust-common/rs-datatype, persist-credentials: false}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {repository: qubit-ltd/rs-redact, ref: '${{ steps.revisions.outputs.rs_redact }}', token: '${{ secrets.DEPENDENCY_TOKEN }}', path: rust-common/rs-redact, persist-credentials: false}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {repository: qubit-ltd/rs-validator, ref: '${{ steps.revisions.outputs.rs_validator }}', token: '${{ secrets.DEPENDENCY_TOKEN }}', path: rust-common/rs-validator, persist-credentials: false}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {repository: qubit-ltd/rs-validation-rules, ref: '${{ steps.revisions.outputs.rs_validation_rules }}', token: '${{ secrets.DEPENDENCY_TOKEN }}', path: rust-common/rs-validation-rules, persist-credentials: false}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
      - name: Verify baseline revisions and Cargo path layout
        working-directory: rust-platform/rs-reflect
        run: |
          python3 scripts/downstream_manifest.py verify --layout-root "$GITHUB_WORKSPACE" --manifest .github/downstream-baseline.json
          python3 scripts/check_dependency_layout.py --layout-root "$GITHUB_WORKSPACE" --project "$GITHUB_WORKSPACE/rust-platform/rs-reflect"
      - name: Cache baseline Cargo state
        uses: actions/cache@v4
        with:
          path: |
            rust-platform/rs-model-metadata/target
            rust-platform/rs-platform/target
            rust-common/rs-id/target
            rust-common/rs-datatype/target
            rust-common/rs-redact/target
            rust-common/rs-validator/target
            rust-common/rs-validation-rules/target
          key: downstream-baseline-toolchain-1.94.0-manifest-${{ hashFiles('rust-platform/**/Cargo.toml', 'rust-common/**/Cargo.toml', 'rust-platform/rs-reflect/.github/downstream-baseline.json') }}-locks-${{ hashFiles('rust-platform/**/Cargo.lock', 'rust-common/**/Cargo.lock') }}
      - name: Run all baseline downstream checks
        working-directory: rust-platform/rs-reflect
        env:
          REFLECT_DOWNSTREAM_EVIDENCE_DIR: ${{ runner.temp }}/rs-reflect-downstream-baseline
        run: ./scripts/check-downstream.sh
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: downstream-baseline-evidence
          path: ${{ runner.temp }}/rs-reflect-downstream-baseline
          if-no-files-found: warn
          retention-days: 14

  downstream-head:
    name: Downstream head
    runs-on: ubuntu-latest
    steps:
      - name: Require private dependency access
        env:
          DEPENDENCY_TOKEN: ${{ secrets.DEPENDENCY_TOKEN }}
        run: test -n "$DEPENDENCY_TOKEN" || { echo 'DEPENDENCY_TOKEN is required for downstream validation.' >&2; exit 1; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: rust-platform/rs-reflect
          persist-credentials: false
      - name: Resolve each main branch to a fixed SHA
        id: revisions
        working-directory: rust-platform/rs-reflect
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_TOKEN }}
        run: |
          python3 scripts/downstream_manifest.py validate --manifest .github/downstream-baseline.json
          python3 scripts/downstream_manifest.py matrix --manifest .github/downstream-baseline.json --mode head > "$RUNNER_TEMP/downstream-matrix.json"
          while IFS=' ' read -r key repository; do
            revision="$(gh api "repos/$repository/commits/main" --jq .sha)"
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid main revision for $repository" >&2; exit 1; }
            printf '%s=%s\n' "$key" "$revision" >> "$GITHUB_OUTPUT"
          done <<EOF
          rs_model_metadata qubit-ltd/rs-model-metadata
          rs_platform qubit-ltd/rs-platform
          rs_id qubit-ltd/rs-id
          rs_datatype qubit-ltd/rs-datatype
          rs_redact qubit-ltd/rs-redact
          rs_validator qubit-ltd/rs-validator
          rs_validation_rules qubit-ltd/rs-validation-rules
          EOF
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {repository: qubit-ltd/rs-model-metadata, ref: '${{ steps.revisions.outputs.rs_model_metadata }}', token: '${{ secrets.DEPENDENCY_TOKEN }}', path: rust-platform/rs-model-metadata, persist-credentials: false}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {repository: qubit-ltd/rs-platform, ref: '${{ steps.revisions.outputs.rs_platform }}', token: '${{ secrets.DEPENDENCY_TOKEN }}', path: rust-platform/rs-platform, persist-credentials: false}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {repository: qubit-ltd/rs-id, ref: '${{ steps.revisions.outputs.rs_id }}', token: '${{ secrets.DEPENDENCY_TOKEN }}', path: rust-common/rs-id, persist-credentials: false}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {repository: qubit-ltd/rs-datatype, ref: '${{ steps.revisions.outputs.rs_datatype }}', token: '${{ secrets.DEPENDENCY_TOKEN }}', path: rust-common/rs-datatype, persist-credentials: false}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {repository: qubit-ltd/rs-redact, ref: '${{ steps.revisions.outputs.rs_redact }}', token: '${{ secrets.DEPENDENCY_TOKEN }}', path: rust-common/rs-redact, persist-credentials: false}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {repository: qubit-ltd/rs-validator, ref: '${{ steps.revisions.outputs.rs_validator }}', token: '${{ secrets.DEPENDENCY_TOKEN }}', path: rust-common/rs-validator, persist-credentials: false}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {repository: qubit-ltd/rs-validation-rules, ref: '${{ steps.revisions.outputs.rs_validation_rules }}', token: '${{ secrets.DEPENDENCY_TOKEN }}', path: rust-common/rs-validation-rules, persist-credentials: false}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
      - name: Record and verify resolved head revisions and path layout
        working-directory: rust-platform/rs-reflect
        env:
          REFLECT_DOWNSTREAM_EVIDENCE_DIR: ${{ runner.temp }}/rs-reflect-downstream-head
        run: |
          mkdir -p "$REFLECT_DOWNSTREAM_EVIDENCE_DIR"
          python3 scripts/downstream_manifest.py collect --layout-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/downstream-head.json"
          python3 scripts/downstream_manifest.py verify --layout-root "$GITHUB_WORKSPACE" --manifest "$RUNNER_TEMP/downstream-head.json"
          python3 scripts/check_dependency_layout.py --layout-root "$GITHUB_WORKSPACE" --project "$GITHUB_WORKSPACE/rust-platform/rs-reflect"
          cp "$RUNNER_TEMP/downstream-head.json" "$REFLECT_DOWNSTREAM_EVIDENCE_DIR/resolved-manifest.json"
      - name: Cache head Cargo state
        uses: actions/cache@v4
        with:
          path: |
            rust-platform/rs-model-metadata/target
            rust-platform/rs-platform/target
            rust-common/rs-id/target
            rust-common/rs-datatype/target
            rust-common/rs-redact/target
            rust-common/rs-validator/target
            rust-common/rs-validation-rules/target
          key: downstream-head-toolchain-1.94.0-manifest-${{ hashFiles('rust-platform/**/Cargo.toml', 'rust-common/**/Cargo.toml', 'rust-platform/rs-reflect/.github/downstream-baseline.json') }}-locks-${{ hashFiles('rust-platform/**/Cargo.lock', 'rust-common/**/Cargo.lock') }}
      - name: Run all head downstream checks
        working-directory: rust-platform/rs-reflect
        env:
          REFLECT_DOWNSTREAM_EVIDENCE_DIR: ${{ runner.temp }}/rs-reflect-downstream-head
        run: ./scripts/check-downstream.sh
      - name: Upload head evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: downstream-head-evidence
          path: ${{ runner.temp }}/rs-reflect-downstream-head
          if-no-files-found: warn
          retention-days: 14

  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prepare local path dependencies
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
      - name: Install Rustfmt toolchain
        if: runner.os == 'Linux'
        run: rustup toolchain install nightly-2026-06-05 --profile minimal --component rustfmt --component clippy
      - name: Install Rust sources for UI test diagnostics
        run: rustup component add rust-src --toolchain 1.94.0
      - name: Run infrastructure CI orchestration
        run: ./.infra/bin/ci-check.sh --only=verify
      - name: Check standard Cargo entry points and run native examples
        run: |
          cargo +1.94.0 test --locked
          cargo +1.94.0 check --locked --examples
          cargo +1.94.0 check --locked --no-default-features --examples
          cargo +1.94.0 run --locked --example field_patch
          cargo +1.94.0 run --locked --example customer_patch
          cargo +1.94.0 run --locked --example support_action
      - name: Check bilingual documentation contracts
        run: python3 scripts/check_document_contracts.py
      - name: Run style, hook, and coverage Clippy
        if: runner.os == 'Linux'
        run: ./.infra/bin/ci-check.sh --only=style,clippy,coverage-cfg-clippy,project-hook
      - name: Install Clippy toolchain on additional platforms
        if: runner.os != 'Linux'
        run: rustup toolchain install nightly-2026-06-05 --profile minimal --component clippy
      - name: Run Clippy on additional platforms
        if: runner.os != 'Linux'
        run: ./.infra/bin/ci-check.sh --only=clippy
      - name: Install legacy CI build toolchain
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Run documentation tests
        run: cargo +1.94.0 test --doc --verbose
      - name: Run README dependency-version check
        run: ./.infra/bin/infra-tool.sh rs-infra-verify --project "$GITHUB_WORKSPACE" run --suite readme
      - name: Install documentation toolchain
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Generate strict all-features documentation
        run: RUSTDOCFLAGS="-D warnings -D missing-docs" cargo +1.94.0 doc --all-features --no-deps --verbose
      - name: Upload documentation artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: rustdoc
          path: target/doc
          retention-days: 14
          if-no-files-found: error
      - name: Package staged release candidate
        id: release-candidate
        env:
          RELEASE_EVIDENCE: ${{ runner.temp }}/reflect-release-staged
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          runtime = tomllib.loads(Path('Cargo.toml').read_text())
          derive = tomllib.loads(Path('derive/Cargo.toml').read_text())
          version = runtime['package']['version']
          assert version == derive['package']['version']
          assert runtime['dependencies']['qubit-reflect-derive']['version'] == '=' + version
          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY
          cargo +1.94.0 --config "patch.crates-io.qubit-reflect.path=\"$PWD\"" package --locked -p qubit-reflect-derive
          cargo +1.94.0 --config "patch.crates-io.qubit-reflect-derive.path=\"$PWD/derive\"" package --locked -p qubit-reflect
          release_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          python3 scripts/check_release_consumer.py --mode staged --version "$release_version" \
            --runtime-archive "$PWD/target/package/qubit-reflect-$release_version.crate" \
            --derive-archive "$PWD/target/package/qubit-reflect-derive-$release_version.crate" \
            --evidence-dir "$RELEASE_EVIDENCE"
      - name: Upload staged consumer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reflect-release-staged-${{ github.sha }}
          path: ${{ runner.temp }}/reflect-release-staged
          if-no-files-found: error
          retention-days: 14

  feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prepare local path dependencies
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
      - name: Install matrix build toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rust-src
      - name: Install matrix Clippy toolchain when required
        run: |
          if jq -e 'any(.checks[]; (.commands | index("clippy")) != null)' \
              .infra/ci/cargo-matrix.json >/dev/null; then
            rustup toolchain install nightly-2026-06-05 --profile minimal --component clippy
          fi
      - name: Run configured feature and dependency matrix
        run: |
          ./.infra/bin/ci-check.sh --only=feature-matrix

  coverage:
    needs: [verify]
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prepare local path dependencies
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
      - name: Install Rust sources for coverage UI tests
        run: rustup component add rust-src --toolchain 1.94
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.6 --locked
      - name: Collect and check coverage
        env:
          # Rust 1.94 non-incremental coverage can lose counters for inline functions.
          CARGO_INCREMENTAL: "1"
        run: ./.infra/bin/coverage.sh
      - name: Build project (release)
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          cargo +1.94.0 build --release --verbose
      - name: Comment coverage on pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- rs-infra-coverage-report -->';
            const body = marker + '\n' + fs.readFileSync('coverage-summary.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const previous = comments.find((comment) => comment.user.type === 'Bot' && comment.body && comment.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            lcov.info
            coverage.txt
            coverage.json
            coverage-badge.json
            coverage-summary.md
            ci-summary.json
            target/llvm-cov/html
            target/llvm-cov/cobertura.xml
          retention-days: 14
          if-no-files-found: error

  derive-coverage:
    name: Derive coverage
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prepare local path dependencies
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
          components: llvm-tools-preview
      - name: Validate Cargo path dependencies
        run: cargo +1.94.0 metadata --locked --format-version 1
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.6 --locked
      - name: Collect and check derive coverage
        run: ./scripts/check-derive-coverage.sh
      - name: Upload derive coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: derive-coverage-reports
          path: target/derive-coverage
          retention-days: 14
          if-no-files-found: error

  pages:
    if: ${{ always() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.verify.result == 'success' && needs.coverage.result == 'success' && needs.derive-coverage.result == 'success' && (needs.feature-matrix.result == 'success' || needs.feature-matrix.result == 'skipped') }}
    needs: [verify, feature-matrix, coverage, derive-coverage]
    outputs:
      deploy: ${{ steps.pages-config.outputs.deploy }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate Pages configuration
        id: pages-config
        run: |
          jq -e '.deploy | type == "boolean"' .infra/ci/pages.json >/dev/null
          echo "deploy=$(jq -r .deploy .infra/ci/pages.json)" >> "$GITHUB_OUTPUT"
      - name: Prepare local path dependencies
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - uses: actions/download-artifact@v8
        with:
          name: coverage-reports
          path: .
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
      - name: Build Pages site
        run: ./.infra/bin/infra-tool.sh rs-infra-pages --project "$GITHUB_WORKSPACE" build
      - name: Prepare Pages artifact
        run: ./.infra/bin/infra-tool.sh rs-infra-pages --project "$GITHUB_WORKSPACE" artifact
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  pages-deploy:
    if: needs.pages.outputs.deploy == 'true' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [pages]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4

  advanced-verification:
    name: Infrastructure suite (${{ matrix.suite }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: miri, os: ubuntu-latest}
          - {suite: miri, os: macos-14}
          - {suite: address-sanitizer, os: ubuntu-latest}
          - {suite: address-sanitizer, os: macos-14}
          - {suite: loom, os: ubuntu-latest}
          - {suite: fuzz, os: ubuntu-latest}
          - {suite: audit, os: ubuntu-latest}
          - {suite: cross, os: ubuntu-latest}
          - {suite: platform, os: ubuntu-latest}
    env:
      RS_INFRA_NIGHTLY_TOOLCHAIN: nightly-2026-06-05
      RS_INFRA_FUZZ_MODE: smoke
      RS_INFRA_FUZZ_SECONDS_PER_TARGET: "10"
      RS_INFRA_FUZZ_MAX_LEN: "4096"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prepare local path dependencies
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
      - name: Detect optional suite configuration
        id: suite-config
        run: |
          set -euo pipefail
          suite='${{ matrix.suite }}'
          enabled=false
          case "$suite" in
            audit) enabled=true ;;
            fuzz)
              if [ -f fuzz/Cargo.toml ] && grep -q 'cargo-fuzz' fuzz/Cargo.toml && grep -q 'true' fuzz/Cargo.toml; then
                enabled=true
              fi
              ;;
            cross)
              if [ -f .infra/ci/cross.toml ] || [ -f Cross.toml ]; then enabled=true; fi
              ;;
            platform)
              if [ -f .infra/ci/platform.toml ]; then enabled=true; fi
              ;;
            miri|address-sanitizer|loom)
              enabled=$(cargo metadata --no-deps --format-version 1                 | python3 -c 'import json,sys; d=json.load(sys.stdin); m=set(d["workspace_members"]); s=sys.argv[1]; found=False
          for p in d["packages"]:
           if p["id"] not in m: continue
           md=p.get("metadata") or {}; cfg=md.get("rs-infra") or {}
           deps=p.get("dependencies") or []
           if s == "miri" and cfg.get("miri") is True: found=True
           elif s == "address-sanitizer" and "address" in cfg.get("sanitizers",[]): found=True
           elif s == "loom" and any(x.get("name") == "loom" for x in deps): found=True
          print("true" if found else "false")' "$suite")
              ;;
          esac
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
      - name: Install suite-specific tools
        if: ${{ steps.suite-config.outputs.enabled == 'true' && (matrix.suite != 'fuzz' || env.RS_INFRA_FUZZ_MODE != 'disabled') }}
        run: |
          case "${{ matrix.suite }}" in
            audit) cargo install cargo-audit --locked ;;
            fuzz)
              rustup toolchain install "$RS_INFRA_NIGHTLY_TOOLCHAIN" --profile minimal
              cargo install cargo-fuzz --locked --version 0.13.2
              ;;
            cross) cargo install cross --locked ;;
            miri)
              rustup toolchain install "$RS_INFRA_NIGHTLY_TOOLCHAIN" --profile minimal --component miri,rust-src
              cargo +"$RS_INFRA_NIGHTLY_TOOLCHAIN" miri setup
              ;;
            address-sanitizer) rustup toolchain install "$RS_INFRA_NIGHTLY_TOOLCHAIN" --profile minimal --component rust-src ;;
          esac
      - name: Run configured infrastructure suite
        if: ${{ steps.suite-config.outputs.enabled == 'true' }}
        run: |
          if [ "${{ matrix.suite }}" = "loom" ]; then
            export RUSTFLAGS="--cfg loom"
          fi
          ./.infra/bin/infra-tool.sh rs-infra-verify --project "$GITHUB_WORKSPACE" run --suite "${{ matrix.suite }}"
      - name: Skip unconfigured infrastructure suite
        if: ${{ steps.suite-config.outputs.enabled != 'true' }}
        run: echo "${{ matrix.suite }} is not configured; skipping."
      - name: Upload fuzz crash artifacts
        if: ${{ failure() && matrix.suite == 'fuzz' && steps.suite-config.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14
