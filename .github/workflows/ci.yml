name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

jobs:
  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          path: rust-platform/rs-reflect
          submodules: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-id
          ref: main
          path: rust-common/rs-id
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-datatype
          ref: main
          path: rust-common/rs-datatype
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
      - run: ./dependency-update.sh --check
        working-directory: rust-platform/rs-reflect

  rust-ci:
    name: rs-infra CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-platform/rs-reflect
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          path: rust-platform/rs-reflect
          submodules: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-id
          ref: main
          path: rust-common/rs-id
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-datatype
          ref: main
          path: rust-common/rs-datatype
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
      - name: Install Rust toolchains
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup toolchain install nightly-2026-06-05 --profile minimal --component rustfmt --component clippy
      - run: ./style-check.sh
      - name: Install coverage and audit tools
        run: |
          rustup component add llvm-tools-preview --toolchain 1.94.0
          cargo install --locked cargo-llvm-cov --version 0.8.6
          cargo install --locked cargo-audit
      - run: RS_INFRA_ARTIFACT_CLEANUP=0 ./ci-check.sh
      - run: ./.infra/tools/coverage-report.sh
      - name: Comment coverage on pull request
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- rs-ci-coverage-report -->';
            const body = `${marker}\n${fs.readFileSync('coverage-summary.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const previous = comments.find((comment) => comment.user.type === 'Bot' && comment.body && comment.body.includes(marker));
            if (previous) await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
      - name: Build project (release)
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
        run: cargo +1.94.0 build --release --verbose
      - name: Build Pages site
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: ./.infra/tools/infra-tool.sh rs-infra-pages --project "$PWD" build
      - name: Configure GitHub Pages
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            rust-platform/rs-reflect/coverage.json
            rust-platform/rs-reflect/lcov.info
            rust-platform/rs-reflect/coverage.txt
            rust-platform/rs-reflect/coverage-badge.json
            rust-platform/rs-reflect/coverage-summary.md
            rust-platform/rs-reflect/target/llvm-cov/html
            rust-platform/rs-reflect/target/llvm-cov/cobertura.xml
          if-no-files-found: error
          retention-days: 14

  cross-platform-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: rust-platform/rs-reflect
          submodules: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-id
          ref: main
          path: rust-common/rs-id
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-datatype
          ref: main
          path: rust-common/rs-datatype
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: rust-platform/rs-reflect
      - run: cargo test --all-features --verbose
        working-directory: rust-platform/rs-reflect

  fuzz-smoke:
    name: Project cargo-fuzz smoke check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
          path: rust-platform/rs-reflect
      - name: Checkout fuzz path dependencies
        uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-id
          ref: main
          path: rust-common/rs-id
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
      - name: Checkout fuzz path dependencies
        uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-datatype
          ref: main
          path: rust-common/rs-datatype
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
      - name: Install cargo-fuzz
        run: |
          rustup toolchain install nightly-2026-06-05 --profile minimal
          cargo install --locked cargo-fuzz --version 0.13.2
      - name: Run fuzz smoke checks
        run: |
          cd rust-platform/rs-reflect
          python3 scripts/check_dependency_layout.py \
            --layout-root "$GITHUB_WORKSPACE" --project "$PWD/fuzz"
          RS_CI_PROJECT_ROOT="$PWD" scripts/cargo-fuzz-check.sh
      - name: Upload fuzz crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ github.sha }}
          path: rust-platform/rs-reflect/fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14

  critical-coverage:
    name: Critical per-file coverage gate
    needs: rust-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false
      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-reports
          path: coverage-reports
      - name: Check critical file thresholds
        run: |
          scripts/critical-coverage-check.sh \
            coverage-reports/coverage.json \
            .infra/ci/critical-coverage.json \
            "$PWD"

  downstream-baseline:
    name: Downstream contracts (fixed baseline)
    runs-on: ubuntu-latest
    env:
      EVIDENCE_DIR: ${{ github.workspace }}/downstream-evidence/baseline
    steps:
      - name: Initialize baseline evidence
        run: |
          mkdir -p "$EVIDENCE_DIR"
          uname -a > "$EVIDENCE_DIR/runner.txt"
          rustc -Vv >> "$EVIDENCE_DIR/runner.txt" 2>&1 || true
      - name: Checkout reflection under review
        id: reflect
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          path: rust-platform/rs-reflect
          submodules: false
      - name: Validate and resolve baseline revisions
        id: resolve
        if: steps.reflect.outcome == 'success'
        run: |
          manifest=rust-platform/rs-reflect/.github/downstream-baseline.json
          if [[ ! -f "$manifest" ]]; then
            echo "error: fixed downstream baseline is missing: $manifest" >&2
            exit 1
          fi
          python3 rust-platform/rs-reflect/scripts/downstream_manifest.py validate \
            --manifest "$manifest"
          matrix=$(python3 rust-platform/rs-reflect/scripts/downstream_manifest.py matrix \
            --manifest "$manifest" --mode baseline)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
      - name: Checkout rs-model-metadata
        id: model-metadata
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_model_metadata.repository }}
          ref: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_model_metadata.revision }}
          path: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_model_metadata.path }}
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - name: Checkout rs-platform
        id: platform
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_platform.repository }}
          ref: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_platform.revision }}
          path: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_platform.path }}
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - name: Checkout rs-id
        id: id
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_id.repository }}
          ref: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_id.revision }}
          path: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_id.path }}
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - name: Checkout rs-datatype
        id: datatype
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_datatype.repository }}
          ref: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_datatype.revision }}
          path: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_datatype.path }}
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - name: Checkout rs-redact
        id: redact
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_redact.repository }}
          ref: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_redact.revision }}
          path: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_redact.path }}
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - name: Checkout rs-validator
        id: validator
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_validator.repository }}
          ref: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_validator.revision }}
          path: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_validator.path }}
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - name: Checkout rs-validation-rules
        id: validation_rules
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_validation_rules.repository }}
          ref: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_validation_rules.revision }}
          path: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_validation_rules.path }}
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - name: Record baseline checkout results
        id: checkout-results
        if: always()
        env:
          REFLECT_RESULT: ${{ steps.reflect.outcome }}
          MODEL_METADATA_RESULT: ${{ steps.model-metadata.outcome }}
          PLATFORM_RESULT: ${{ steps.platform.outcome }}
          ID_RESULT: ${{ steps.id.outcome }}
          DATATYPE_RESULT: ${{ steps.datatype.outcome }}
          REDACT_RESULT: ${{ steps.redact.outcome }}
          VALIDATOR_RESULT: ${{ steps.validator.outcome }}
          VALIDATION_RULES_RESULT: ${{ steps.validation_rules.outcome }}
        run: |
          results="$EVIDENCE_DIR/checkout-results.txt"
          missing="$EVIDENCE_DIR/missing-repositories.txt"
          : > "$results"
          : > "$missing"
          failed=0
          record() {
            name=$1
            path=$2
            outcome=$3
            printf '%s=%s\n' "$name" "$outcome" >> "$results"
            if [[ "$outcome" != success ]] || ! git -C "$path" rev-parse --git-dir >/dev/null 2>&1; then
              printf '%s\n' "$name" >> "$missing"
              failed=1
              return
            fi
            git -C "$path" rev-parse HEAD >> "$results"
            git -C "$path" status --porcelain >> "$results"
          }
          record rs-reflect rust-platform/rs-reflect "$REFLECT_RESULT"
          record rs-model-metadata rust-platform/rs-model-metadata "$MODEL_METADATA_RESULT"
          record rs-platform rust-platform/rs-platform "$PLATFORM_RESULT"
          record rs-id rust-common/rs-id "$ID_RESULT"
          record rs-datatype rust-common/rs-datatype "$DATATYPE_RESULT"
          record rs-redact rust-common/rs-redact "$REDACT_RESULT"
          record rs-validator rust-common/rs-validator "$VALIDATOR_RESULT"
          record rs-validation-rules rust-common/rs-validation-rules "$VALIDATION_RULES_RESULT"
          find rust-platform rust-common -name Cargo.lock -type f -print0 2>/dev/null \
            | sort -z | xargs -0 -r sha256sum > "$EVIDENCE_DIR/checkout-lock-sha256.txt"
          exit "$failed"
      - name: Cache baseline Cargo state
        if: steps.resolve.outcome == 'success' && steps.checkout-results.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-platform/*/target
            rust-common/*/target
          key: downstream-baseline-${{ runner.os }}-toolchain-1.94.0-manifest-${{ hashFiles('rust-platform/rs-reflect/.github/downstream-baseline.json') }}-locks-${{ hashFiles('rust-platform/*/Cargo.lock', 'rust-common/*/Cargo.lock') }}
      - name: Install build toolchain
        if: steps.resolve.outcome == 'success' && steps.checkout-results.outcome == 'success'
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Validate fixed downstream contracts
        if: steps.resolve.outcome == 'success' && steps.checkout-results.outcome == 'success'
        env:
          REFLECT_DOWNSTREAM_EVIDENCE_DIR: ${{ env.EVIDENCE_DIR }}
        run: |
          python3 rust-platform/rs-reflect/scripts/downstream_manifest.py verify \
            --layout-root "$GITHUB_WORKSPACE" \
            --manifest rust-platform/rs-reflect/.github/downstream-baseline.json
          rust-platform/rs-reflect/scripts/check-downstream.sh
      - name: Upload fixed baseline evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: downstream-baseline-${{ github.sha }}
          path: downstream-evidence/baseline
          if-no-files-found: error
          retention-days: 14

  downstream-head:
    name: Downstream contracts (main heads)
    runs-on: ubuntu-latest
    env:
      EVIDENCE_DIR: ${{ github.workspace }}/downstream-evidence/head
    steps:
      - name: Initialize head evidence
        run: |
          mkdir -p "$EVIDENCE_DIR"
          uname -a > "$EVIDENCE_DIR/runner.txt"
          rustc -Vv >> "$EVIDENCE_DIR/runner.txt" 2>&1 || true
      - name: Checkout reflection under review
        id: reflect
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          path: rust-platform/rs-reflect
          submodules: false
      - name: Resolve head revisions
        id: resolve
        if: steps.reflect.outcome == 'success'
        run: |
          manifest=rust-platform/rs-reflect/.github/downstream-baseline.json
          python3 rust-platform/rs-reflect/scripts/downstream_manifest.py validate \
            --manifest "$manifest"
          matrix=$(python3 rust-platform/rs-reflect/scripts/downstream_manifest.py matrix \
            --manifest "$manifest" \
            --mode head)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
      - name: Checkout rs-model-metadata
        id: model-metadata
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_model_metadata.repository }}
          ref: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_model_metadata.revision }}
          path: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_model_metadata.path }}
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - name: Checkout rs-platform
        id: platform
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_platform.repository }}
          ref: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_platform.revision }}
          path: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_platform.path }}
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - name: Checkout rs-id
        id: id
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_id.repository }}
          ref: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_id.revision }}
          path: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_id.path }}
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - name: Checkout rs-datatype
        id: datatype
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_datatype.repository }}
          ref: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_datatype.revision }}
          path: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_datatype.path }}
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - name: Checkout rs-redact
        id: redact
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_redact.repository }}
          ref: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_redact.revision }}
          path: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_redact.path }}
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - name: Checkout rs-validator
        id: validator
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_validator.repository }}
          ref: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_validator.revision }}
          path: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_validator.path }}
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - name: Checkout rs-validation-rules
        id: validation_rules
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_validation_rules.repository }}
          ref: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_validation_rules.revision }}
          path: ${{ fromJSON(steps.resolve.outputs.matrix).repositories.rs_validation_rules.path }}
          token: ${{ secrets.DEPENDENCY_TOKEN || github.token }}
          submodules: false
      - name: Record head checkout results
        id: checkout-results
        if: always()
        env:
          REFLECT_RESULT: ${{ steps.reflect.outcome }}
          MODEL_METADATA_RESULT: ${{ steps.model-metadata.outcome }}
          PLATFORM_RESULT: ${{ steps.platform.outcome }}
          ID_RESULT: ${{ steps.id.outcome }}
          DATATYPE_RESULT: ${{ steps.datatype.outcome }}
          REDACT_RESULT: ${{ steps.redact.outcome }}
          VALIDATOR_RESULT: ${{ steps.validator.outcome }}
          VALIDATION_RULES_RESULT: ${{ steps.validation_rules.outcome }}
        run: |
          results="$EVIDENCE_DIR/checkout-results.txt"
          missing="$EVIDENCE_DIR/missing-repositories.txt"
          : > "$results"
          : > "$missing"
          failed=0
          record() {
            name=$1
            path=$2
            outcome=$3
            printf '%s=%s\n' "$name" "$outcome" >> "$results"
            if [[ "$outcome" != success ]] || ! git -C "$path" rev-parse --git-dir >/dev/null 2>&1; then
              printf '%s\n' "$name" >> "$missing"
              failed=1
              return
            fi
            git -C "$path" rev-parse HEAD >> "$results"
            git -C "$path" status --porcelain >> "$results"
          }
          record rs-reflect rust-platform/rs-reflect "$REFLECT_RESULT"
          record rs-model-metadata rust-platform/rs-model-metadata "$MODEL_METADATA_RESULT"
          record rs-platform rust-platform/rs-platform "$PLATFORM_RESULT"
          record rs-id rust-common/rs-id "$ID_RESULT"
          record rs-datatype rust-common/rs-datatype "$DATATYPE_RESULT"
          record rs-redact rust-common/rs-redact "$REDACT_RESULT"
          record rs-validator rust-common/rs-validator "$VALIDATOR_RESULT"
          record rs-validation-rules rust-common/rs-validation-rules "$VALIDATION_RULES_RESULT"
          find rust-platform rust-common -name Cargo.lock -type f -print0 2>/dev/null \
            | sort -z | xargs -0 -r sha256sum > "$EVIDENCE_DIR/checkout-lock-sha256.txt"
          exit "$failed"
      - name: Cache head Cargo state
        if: steps.resolve.outcome == 'success' && steps.checkout-results.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-platform/*/target
            rust-common/*/target
          key: downstream-head-${{ runner.os }}-toolchain-1.94.0-manifest-${{ hashFiles('rust-platform/rs-reflect/.github/downstream-baseline.json') }}-locks-${{ hashFiles('rust-platform/*/Cargo.lock', 'rust-common/*/Cargo.lock') }}
      - name: Install build toolchain
        if: steps.resolve.outcome == 'success' && steps.checkout-results.outcome == 'success'
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Validate head downstream contracts
        if: steps.resolve.outcome == 'success' && steps.checkout-results.outcome == 'success'
        env:
          REFLECT_DOWNSTREAM_EVIDENCE_DIR: ${{ env.EVIDENCE_DIR }}
        run: rust-platform/rs-reflect/scripts/check-downstream.sh
      - name: Upload head evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: downstream-head-${{ github.sha }}
          path: downstream-evidence/head
          if-no-files-found: error
          retention-days: 14

  deploy-pages:
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: rust-ci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
