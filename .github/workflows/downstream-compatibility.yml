name: Private downstream compatibility

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  downstream-compatibility:
    name: Full private downstream compatibility
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      # Set these repository variables to the merged migration commit SHAs.
      # The job fails closed until the real revisions are supplied.
      RS_MODEL_METADATA_VNEXT_SHA: ${{ vars.RS_MODEL_METADATA_VNEXT_SHA }}
      RS_PLATFORM_VNEXT_SHA: ${{ vars.RS_PLATFORM_VNEXT_SHA }}
      DEPENDENCY_TOKEN: ${{ secrets.DEPENDENCY_TOKEN }}
    steps:
      - name: Require private checkout credentials and migration revisions
        shell: bash
        run: |
          if [[ -z "$DEPENDENCY_TOKEN" ]]; then
            echo "Required secret DEPENDENCY_TOKEN is missing for the trusted downstream compatibility job." >&2
            exit 1
          fi
          if [[ ! "$RS_MODEL_METADATA_VNEXT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Required repository variable RS_MODEL_METADATA_VNEXT_SHA must be set to the migrated rs-model-metadata commit SHA." >&2
            exit 1
          fi
          if [[ ! "$RS_PLATFORM_VNEXT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Required repository variable RS_PLATFORM_VNEXT_SHA must be set to the migrated rs-platform commit SHA." >&2
            exit 1
          fi

      - name: Check out this rs-reflect revision
        uses: actions/checkout@v6
        with:
          path: rust-common/rs-reflect
          submodules: false

      - name: Check out migrated downstream repositories
        uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-model-metadata
          ref: ${{ env.RS_MODEL_METADATA_VNEXT_SHA }}
          path: rust-common/rs-model-metadata
          token: ${{ secrets.DEPENDENCY_TOKEN }}
          submodules: false

      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-platform
          ref: ${{ env.RS_PLATFORM_VNEXT_SHA }}
          path: rust-common/rs-platform
          token: ${{ secrets.DEPENDENCY_TOKEN }}
          submodules: false

      - name: Check out the fixed local path dependencies
        uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-codec
          ref: 975501f075de49cfb3c473c5048137daec608b43
          path: rust-common/rs-codec
          token: ${{ secrets.DEPENDENCY_TOKEN }}
          submodules: false

      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-validator
          ref: fb64546a16ca7659e10d9296728e1cfdace86de0
          path: rust-common/rs-validator
          token: ${{ secrets.DEPENDENCY_TOKEN }}
          submodules: false

      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-validation-rules
          ref: 815b4bc35f69e8e0b6ae29459497d59dd50a0a4c
          path: rust-common/rs-validation-rules
          token: ${{ secrets.DEPENDENCY_TOKEN }}
          submodules: false

      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-id
          ref: 7425188a7fdebcc94aac9915bcc79c535b3eb1db
          path: rust-common/rs-id
          token: ${{ secrets.DEPENDENCY_TOKEN }}
          submodules: false

      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-datatype
          ref: 48c4aee096f97c483dd44d6ded00bd166ccb0985
          path: rust-common/rs-datatype
          token: ${{ secrets.DEPENDENCY_TOKEN }}
          submodules: false

      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-redact
          ref: 5b992b879ab1bbff5a34c141693d0c6334604cdc
          path: rust-common/rs-redact
          token: ${{ secrets.DEPENDENCY_TOKEN }}
          submodules: false

      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-redact-derive
          ref: fdb0ad4b73d5a22745d5db1326075eaa852ec483
          path: rust-common/rs-redact-derive
          token: ${{ secrets.DEPENDENCY_TOKEN }}
          submodules: false

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0

      - name: Check rs-model-metadata
        run: cargo check --manifest-path rust-common/rs-model-metadata/Cargo.toml --workspace --all-features

      - name: Test rs-model-metadata
        run: cargo test --manifest-path rust-common/rs-model-metadata/Cargo.toml --workspace --all-features

      - name: Check rs-platform
        run: cargo check --manifest-path rust-common/rs-platform/Cargo.toml --workspace --all-features

      - name: Test rs-platform
        run: cargo test --manifest-path rust-common/rs-platform/Cargo.toml --workspace --all-features

  fork-pull-request:
    name: Private downstream job skipped for fork PR
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Report private downstream check skipped
        run: |
          echo "Full downstream compatibility was skipped for this fork pull request because private repositories cannot be checked out with fork PR credentials." >> "$GITHUB_STEP_SUMMARY"
