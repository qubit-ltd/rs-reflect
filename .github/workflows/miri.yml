name: Miri borrowed value boundaries

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  borrowed-value-boundaries:
    name: Borrowed value mode boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-06-05
          components: miri
      - name: Check borrowed value boundaries with Miri
        run: ./scripts/check-miri.sh
